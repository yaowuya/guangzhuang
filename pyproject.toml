[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beauty-intelligence-api"
version = "0.1.0"
description = "Personal headline discovery application"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2,<3",
  "uvicorn>=0.30,<1",
  "SQLAlchemy>=2,<3",
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1,<26",
  "defusedxml>=0.7,<1",
  "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
